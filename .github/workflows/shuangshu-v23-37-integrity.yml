name: Shuangshu V23.37 Candidate Integrity
on:
  pull_request:
    paths:
      - 'projects/shuangshu-shangtu/scripts/candidates/V23.37R1_CANDIDATE_E001-E064.md'
      - 'projects/shuangshu-shangtu/scripts/candidates/verify_v23_37.py'
      - '.github/workflows/shuangshu-v23-37-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify source, frozen episodes, deltas and structural anchors
        run: python3 projects/shuangshu-shangtu/scripts/candidates/verify_v23_37.py
